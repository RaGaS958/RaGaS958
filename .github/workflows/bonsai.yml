
name: Grow My Git Bonsai

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  grow:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Bonsai
        uses: egorthinks/git-bonsai@v1
        with:
          user: RaGaS958
          output-dir: output
          season: auto
          commit: true
